[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "venkatagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "aws-opentelemetry-distro ~= 0.21.0",
    "openai",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
